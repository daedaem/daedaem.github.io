<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc"><title id="title">파일 크기와 내부 여유는 다른 수치</title><desc id="desc">설명용 50GB 파일 안에 세그먼트 할당 10GB와 미할당 공간 40GB가 있다. 내부 여유가 OS 여유로 자동 반환되지는 않는다.</desc>
<style>@font-face{font-family:BlogDiagram;src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}</style><!-- Embedded BlogDiagram font subset derived from Pretendard; see OFL.txt. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526580"/></marker></defs>
<rect width="560" height="320" rx="16" fill="#f7f9fc"/>
<g font-family="BlogDiagram, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#191f28">
<text x="28" y="40" text-anchor="start" font-size="24" font-weight="700" fill="#191f28">파일 크기와 내부 여유는 다른 수치</text>
<rect x="28" y="78" width="504" height="190" rx="10" fill="#fff" stroke="#9ba9bc" stroke-width="1.5"/>
<text x="280" y="112" text-anchor="middle" font-size="22" font-weight="600" fill="#191f28">OS에서 점유한 데이터파일: 50GB</text>
<rect x="48" y="140" width="208" height="96" rx="10" fill="#e8f0fe" stroke="#1b64da" stroke-width="1.5"/>
<text x="152.0" y="181.0" text-anchor="middle" font-size="22" font-weight="600" fill="#191f28">세그먼트 할당</text>
<text x="152.0" y="211.0" text-anchor="middle" font-size="22" font-weight="400" fill="#191f28">10GB</text>
<rect x="278" y="140" width="234" height="96" rx="10" fill="#fff" stroke="#9ba9bc" stroke-width="1.5"/>
<text x="395.0" y="181.0" text-anchor="middle" font-size="22" font-weight="600" fill="#191f28">미할당 여유</text>
<text x="395.0" y="211.0" text-anchor="middle" font-size="22" font-weight="400" fill="#191f28">40GB</text>
<text x="280" y="299" text-anchor="middle" font-size="22" font-weight="600" fill="#191f28">내부 여유 ≠ 파일시스템 여유</text>
</g></svg>
